name: macOS

on:
  push:
    branches:
      - main
      - feature/macos-v1
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          uname -a
          xcrun swift --version
          xcodebuild -version

      - name: Validate the shipped sample deck
        run: python3 source/make-cued-deck/scripts/validate_cued.py app/sample.cued.json

      - name: Test the native app
        working-directory: macos
        run: swift test

      - name: Build the inspection app
        run: bash macos/scripts/build-app.sh

      - name: Check the skill return helper
        run: >-
          python3 source/make-cued-deck/scripts/open_in_cued.py
          app/sample.cued.json
          --app macos/dist/Cued.app
          --dry-run

      - name: Inspect the bundle
        run: |
          plutil -p macos/dist/Cued.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 macos/dist/Cued.app
          test -f macos/dist/Cued.app/Contents/Resources/CuedSupport/make-cued-deck/SKILL.md
          test -f macos/dist/Cued.app/Contents/Resources/CuedSupport/make-cued-deck-claude.zip

      - name: Upload inspection package
        uses: actions/upload-artifact@v4
        with:
          name: Cued-macOS-1.0.0-inspection
          path: |
            macos/dist/Cued-macOS-1.0.0-inspection.zip
            macos/dist/SHA256SUMS.txt
          if-no-files-found: error

